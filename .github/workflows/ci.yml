name: Contracts CI

permissions:
  contents: read

# Runs on every push and PR. A vault holding customer money should not be able
# to regress silently between a green local run and a merge.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# A new push to the same branch cancels the older run. Saves minutes and stops
# a stale red X sitting on a commit that was already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardhat:
    name: Hardhat unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Compile separately so a build break is reported as a build break
      # rather than as 34 mysterious test failures.
      - name: Compile
        run: npx hardhat compile

      - name: Repeatable build check
        run: npm run release:reproducible

      - name: Test
        run: npx hardhat test

      - name: Dependency advisory gate
        # Low legacy elliptic advisory remains documented, not suppressed.
        run: npm audit --audit-level=moderate

  foundry:
    name: Fuzz and invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # OpenZeppelin comes from npm, and foundry.toml remaps @openzeppelin/ to
      # node_modules. One dependency tree for both toolchains rather than two
      # that can drift apart.
      - run: npm ci --ignore-scripts

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@77041d2ce690e692d6e03cc812b57d1ddaa4d505 --no-git

      - name: Fuzz and invariant suite
        run: forge test -vv

  slither:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # The old Docker action ships Python <3.10, which cannot install 0.11.5.
      # Use the runner's Python in an isolated environment and Hardhat's pinned solc.
      - name: Install static analysis tooling
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Slither requires Python >=3.10"'
          python3 -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/python" -m pip install slither-analyzer==0.11.5

      - name: Compile for static analysis
        run: npx hardhat compile

      - name: Static analysis gate
        # Preserve the medium/high gate and exact-ID triage, not broad suppression.
        run: |
          export VIRTUAL_ENV="$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/slither" . \
            --compile-force-framework hardhat --hardhat-ignore-compile \
            --filter-paths 'node_modules|contracts/test|lib' --fail-medium

  deploy-script:
    name: Deploy script against a Celo fork
    runs-on: ubuntu-latest
    env:
      CELO_FORK_RPC_URL: ${{ vars.CELO_FORK_RPC_URL }}
      CELO_FORK_SOURCE_RPC_URL: ${{ secrets.CELO_FORK_SOURCE_RPC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # THE POINT OF THIS JOB.
      #
      # The vault starts closed. A deployment that fails to seed remains
      # unusable; verify the real token readbacks and explicit seed operation.
      #
      # Unit tests cannot catch a broken seed. Running the real script against
      # a fork of Celo mainnet exercises it against the actual USDC, USDm and
      # USDT contracts, and the script asserts tokenAllowlistEnforced() is true
      # afterwards. If a token address rots or the seeding breaks, this job
      # goes red rather than leaving an unusable deployment unnoticed.
      - name: Start a Celo mainnet fork
        run: |
          test -n "$CELO_FORK_RPC_URL" || {
            echo "::error::Set repository Actions variable CELO_FORK_RPC_URL to http://127.0.0.1:8545 (local runner only)."
            exit 1
          }
          test -n "$CELO_FORK_SOURCE_RPC_URL" || {
            echo "::error::Set repository Actions secret CELO_FORK_SOURCE_RPC_URL to your Celo mainnet read-only fork-capable RPC endpoint."
            exit 1
          }
          node scripts/check-local-fork.js
          npx hardhat node --hostname 127.0.0.1 --fork "$CELO_FORK_SOURCE_RPC_URL" > /tmp/fork.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -m 2 -X POST "$CELO_FORK_RPC_URL" \
                 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 | grep -q result; then
              echo "fork is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "fork did not start; RPC logs withheld to protect endpoint credentials"; exit 1

      - name: Deploy and seed the allowlist
        env:
          # Well-known Hardhat test accounts. Not secrets, and not usable
          # anywhere but a local fork.
          SIVAN_FEE_COLLECTOR: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
          SIVAN_AGENT_ATTESTER: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
        run: npx hardhat run scripts/deploy.js --network celofork | tee /tmp/deploy.log

      - name: Assert the allowlist actually engaged
        run: |
          grep -q "Allowlist enforced" /tmp/deploy.log \
            || { echo "allowlist did not engage"; exit 1; }
          # USDC is the primary asset and must be listed FIRST.
          #
          # This was `grep -A 1 ... | grep -q USDC`, which only asked whether
          # USDC appeared somewhere in a two line window. Renaming the first
          # entry to XXXX still passed, because USDC was still present on the
          # following line. An assertion that survives the thing it exists to
          # catch is decoration.
          #
          # Take the first token line after the header and require it to be
          # USDC by position, not by presence.
          FIRST=$(grep -A 1 "Verifying tokens on chain" /tmp/deploy.log \
                  | tail -n 1 | awk '{print $1}')
          if [ "$FIRST" != "USDC" ]; then
            echo "expected USDC listed first, got: '$FIRST'"
            exit 1
          fi
          echo "seed verified: allowlist enforced, USDC first"

  naming:
    name: USDm naming guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Portable across every Sivan repository. Copy scripts/check-usdm-naming.sh
      # into any repo and add this job; the rules live in the script, not here,
      # so they stay identical everywhere rather than drifting per repo.
      - run: ./scripts/check-usdm-naming.sh
